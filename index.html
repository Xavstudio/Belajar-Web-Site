<!DOCTYPE html>
<html>
<head>
  <title>My Website</title>
  <!-- Menghubungkan file CSS agar desainnya aktif -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="Kartu-Profil">
    <!-- Memperbaiki penulisan nama file gambar dan atribut -->
    <img src="foto.profil.jpg" alt="Foto profil saya">
    <h1>Nama Anda</h1>
    <p>Selamat datang!</p>
    <!-- Memperbaiki atribut 'herf' menjadi 'href' -->
    <a href="https://www.instagram.com/usernameanda">Kunjungi Instagram saya</a>
    <br><br>
    <!-- Menyamakan huruf besar/kecil ID tombol dengan JavaScript -->
    <button id="sapaButton">Sapa Saya!</button>
  </div>

  <!-- Menghubungkan file JavaScript dengan benar -->
  <script src="script.js"></script>
</body>
</html>
